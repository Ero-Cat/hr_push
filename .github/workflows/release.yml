name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - macos
          - windows

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: beta
  FLUTTER_VERSION: 3.40.0-0.2.pre

jobs:
  create_release:
    name: Ensure GitHub Release Exists
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Create or update release
        id: release
        if: github.event_name == 'push' || github.event.inputs.job == 'all'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          allowUpdates: true
          draft: false
          prerelease: false
          generateReleaseNotes: true

  build_android:
    name: Android APK
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event.inputs.job == 'all' || github.event.inputs.job == 'android')
    needs: create_release
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Sync version & build APK
        run: |
          chmod +x scripts/sync-version.sh && scripts/sync-version.sh
          flutter build apk --release
          
      - name: Rename & upload APK
        run: |
          VERSION="${{ github.ref_name }}"
          mv build/app/outputs/flutter-apk/app-release.apk "app-release-${VERSION}.apk"
          
      - name: Upload APK to release
        if: github.event_name == 'push' || github.event.inputs.job == 'all'
        uses: softprops/action-gh-release@v1
        with:
          files: app-release-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_macos:
    name: macOS App Bundle
    runs-on: macos-latest
    if: (github.event_name == 'push' || github.event.inputs.job == 'all' || github.event.inputs.job == 'macos')
    needs: create_release
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Sync version & build macOS
        run: |
          chmod +x scripts/sync-version.sh && scripts/sync-version.sh
          flutter build macos --release
          
      - name: Archive macOS app
        run: |
          APP_DIR="build/macos/Build/Products/Release"
          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in $APP_DIR"
            ls -la "$APP_DIR"
            exit 1
          fi
          VERSION="${{ github.ref_name }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "hr-push-macos-${VERSION}.zip"
          
      - name: Upload macOS zip to release
        if: github.event_name == 'push' || github.event.inputs.job == 'all'
        uses: softprops/action-gh-release@v1
        with:
          files: hr-push-macos-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_windows:
    name: Windows ZIP
    runs-on: windows-latest
    if: (github.event_name == 'push' || github.event.inputs.job == 'all' || github.event.inputs.job == 'windows')
    needs: create_release
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:'
          
      - name: Enable Windows desktop & install deps
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
        shell: pwsh
        
      - name: Sync version & build Windows
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:').ToString().Split(' ')[1].Split('+')[0]
          (Get-Content lib/pages/settings_page.dart) -replace "'v[0-9]+\.[0-9]+\.[0-9]+'" , "'v$version'" | Set-Content lib/pages/settings_page.dart
          Write-Host "Synced version to v$version"
          flutter build windows --release
        shell: pwsh
        
      - name: Archive Windows build
        run: |
          $env:VERSION="${{ github.ref_name }}"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "hr-push-windows-$env:VERSION.zip"
        shell: pwsh
        
      - name: Upload Windows zip to release
        if: github.event_name == 'push' || github.event.inputs.job == 'all'
        uses: softprops/action-gh-release@v1
        with:
          files: hr-push-windows-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
