name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
          - linux
          - macos
          - windows

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: beta
  FLUTTER_VERSION: 3.40.0-0.2.pre

jobs:
  create_release:
    name: Ensure GitHub Release Exists
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Create or update release
        id: release
        if: github.event_name == 'push' || github.event.inputs.job == 'all'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          allowUpdates: true
          draft: false
          prerelease: false
          generateReleaseNotes: true

  build_android:
    name: Android APK
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event.inputs.job == 'all' || github.event.inputs.job == 'android')
    needs: create_release
    env:
      # Step-level `if` may not reference the secrets context; surface it
      # through job env instead.
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # When absent, the Play upload step is skipped (AAB still ships to the
      # GitHub Release) so the pipeline works before Play automation is set up.
      HAS_PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install dependencies
        run: flutter pub get

      # A stable release keystore keeps APK signatures consistent across
      # releases so the in-app updater can over-install updates. When the
      # secrets are absent we fall back to the debug signing config (the
      # pre-existing behavior).
      - name: Restore release keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks
          {
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storeFile=release-keystore.jks"
          } > android/key.properties

      - name: Sync version & build APK + AAB
        run: |
          chmod +x scripts/sync-version.sh && scripts/sync-version.sh
          # github flavor: full build incl. in-app self-updater.
          flutter build apk --release --flavor github
          flutter build apk --release --flavor github --split-per-abi
          # play flavor: installer permission stripped, updater compiled out.
          flutter build appbundle --release --flavor play --dart-define=PLAY_BUILD=true

      - name: Rename APKs & AAB
        run: |
          VERSION="${{ github.ref_name }}"
          OUT=build/app/outputs/flutter-apk
          mv "$OUT/app-github-release.apk" "app-release-${VERSION}.apk"
          mv "$OUT/app-arm64-v8a-github-release.apk" "hr-push-android-${VERSION}-arm64.apk"
          mv "$OUT/app-armeabi-v7a-github-release.apk" "hr-push-android-${VERSION}-arm32.apk"
          mv build/app/outputs/bundle/playRelease/app-play-release.aab "hr-push-android-${VERSION}.aab"

      - name: Build Play release notes
        run: |
          mkdir -p whatsnew
          # Latest section of each changelog, capped at Play's 500-char limit.
          awk '/^## /{if (found) exit; found=1; next} found' CHANGELOG.md | head -c 500 > whatsnew/zh-CN.txt
          awk '/^### /{if (found) exit; found=1; next} found' README_EN.md | head -c 500 > whatsnew/en-US.txt
          [ -s whatsnew/zh-CN.txt ] || echo "问题修复与体验优化。" > whatsnew/zh-CN.txt
          [ -s whatsnew/en-US.txt ] || echo "Bug fixes and improvements." > whatsnew/en-US.txt
          cat whatsnew/*.txt

      - name: Upload APKs & AAB to release
        if: github.event_name == 'push' || github.event.inputs.job == 'all'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app-release-${{ github.ref_name }}.apk
            hr-push-android-${{ github.ref_name }}-arm64.apk
            hr-push-android-${{ github.ref_name }}-arm32.apk
            hr-push-android-${{ github.ref_name }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Automatic Play upload. Goes to the internal testing track first —
      # promote to production from Play Console, or change `track` to
      # `production` once the pipeline is proven.
      - name: Deploy AAB to Google Play
        if: env.HAS_PLAY_JSON == 'true' && (github.event_name == 'push' || github.event.inputs.job == 'all' || github.event.inputs.job == 'android')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: moe.iacg.hrpush
          releaseFile: hr-push-android-${{ github.ref_name }}.aab
          track: internal
          releaseName: ${{ github.ref_name }}
          status: completed
          whatsNewDirectory: whatsnew

  build_ios:
    name: iOS Unsigned IPA
    runs-on: macos-latest
    if: (github.event_name == 'push' || github.event.inputs.job == 'all' || github.event.inputs.job == 'ios')
    needs: create_release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install dependencies
        run: flutter pub get

      - name: Sync version & build iOS (unsigned)
        run: |
          chmod +x scripts/sync-version.sh && scripts/sync-version.sh
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          VERSION="${{ github.ref_name }}"
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found at $APP_PATH"
            find build/ios -maxdepth 3 -type d -print || true
            exit 1
          fi
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "hr-push-ios-${VERSION}-unsigned.ipa" Payload
          unzip -l "hr-push-ios-${VERSION}-unsigned.ipa" | head -5

      - name: Upload IPA to release
        if: github.event_name == 'push' || github.event.inputs.job == 'all'
        uses: softprops/action-gh-release@v1
        with:
          files: hr-push-ios-${{ github.ref_name }}-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_linux:
    name: Linux Tarball
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event.inputs.job == 'all' || github.event.inputs.job == 'linux')
    needs: create_release
    steps:
      - uses: actions/checkout@v4

      # tray_manager's Linux backend pkg-configs ayatana-appindicator3,
      # so its dev package is a hard build requirement alongside the
      # usual Flutter Linux toolchain.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config libayatana-appindicator3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install dependencies
        run: flutter pub get

      - name: Sync version & build Linux
        run: |
          chmod +x scripts/sync-version.sh && scripts/sync-version.sh
          flutter build linux --release

      - name: Archive Linux bundle
        run: |
          VERSION="${{ github.ref_name }}"
          BUNDLE="build/linux/x64/release/bundle"
          if [ ! -x "$BUNDLE/hr_push" ]; then
            echo "bundle binary not found in $BUNDLE"
            ls -la "$BUNDLE" || true
            exit 1
          fi
          tar -czf "hr-push-linux-${VERSION}.tar.gz" -C "$BUNDLE" .
          tar -tzf "hr-push-linux-${VERSION}.tar.gz" | head -5

      - name: Upload Linux tarball to release
        if: github.event_name == 'push' || github.event.inputs.job == 'all'
        uses: softprops/action-gh-release@v1
        with:
          files: hr-push-linux-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_macos:
    name: macOS App Bundle
    runs-on: macos-latest
    if: (github.event_name == 'push' || github.event.inputs.job == 'all' || github.event.inputs.job == 'macos')
    needs: create_release
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Sync version & build macOS
        run: |
          chmod +x scripts/sync-version.sh && scripts/sync-version.sh
          flutter build macos --release
          
      - name: Archive macOS app
        run: |
          APP_DIR="build/macos/Build/Products/Release"
          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in $APP_DIR"
            ls -la "$APP_DIR"
            exit 1
          fi
          VERSION="${{ github.ref_name }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "hr-push-macos-${VERSION}.zip"
          
      - name: Upload macOS zip to release
        if: github.event_name == 'push' || github.event.inputs.job == 'all'
        uses: softprops/action-gh-release@v1
        with:
          files: hr-push-macos-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_windows:
    name: Windows ZIP
    runs-on: windows-latest
    if: (github.event_name == 'push' || github.event.inputs.job == 'all' || github.event.inputs.job == 'windows')
    needs: create_release
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:'
          
      - name: Enable Windows desktop & install deps
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
        shell: pwsh
        
      - name: Sync version & build Windows
        run: |
          chmod +x scripts/sync-version.sh && scripts/sync-version.sh
          flutter build windows --release
        shell: bash
        
      - name: Archive Windows build
        run: |
          $env:VERSION="${{ github.ref_name }}"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "hr-push-windows-$env:VERSION.zip"
        shell: pwsh

      - name: Fetch installer language file (Chinese Simplified)
        shell: pwsh
        run: |
          # Not bundled with Inno Setup; #if guards in hr_push.iss tolerate
          # a failed download by falling back to English/Japanese only.
          try {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile "windows\installer\ChineseSimplified.isl"
          } catch {
            Write-Warning "ChineseSimplified.isl download failed: $($_.Exception.Message)"
          }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}" -replace '^v',''
          New-Item -ItemType Directory -Force -Path build\windows\installer | Out-Null
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$version" windows\installer\hr_push.iss
          Get-Item "build\windows\installer\hr-push-windows-v$version-setup.exe"

      - name: Upload Windows artifacts to release
        if: github.event_name == 'push' || github.event.inputs.job == 'all'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            hr-push-windows-${{ github.ref_name }}.zip
            build/windows/installer/hr-push-windows-${{ github.ref_name }}-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
